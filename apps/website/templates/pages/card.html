{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .header {
            background-color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            width: 50px;
            height: 50px;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #333;
        }
        
        .nav-links a.active {
            color: #4CAF50;
        }
        
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .btn-outline {
            background-color: white;
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }
        
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        
        .payment-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .payment-option {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .payment-option.active {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }
        
        input[type="radio"] {
            margin-right: 10px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .input-row input[type="text"] {
            flex: 1 1 calc(50% - 5px);
            min-width: 120px;
        }
        
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            flex: 1 1 auto;
            text-align: center;
        }
        
        .button-primary {
            background-color: #4CAF50;
            color: white;
        }
        
        .button-secondary {
            background-color: #f0f0f0;
            color: #333;
        }
        
        .card-icons {
            position: absolute;
            right: 15px;
            top: 15px;
        }
        
        .card-icons img {
            height: 22px;
            width: auto;
            max-width: 100%;
        }
        
        @media (max-width: 480px) {
            .payment-container {
                padding: 20px;
            }
            h1 {
                font-size: 20px;
            }
            .button-container {
                flex-direction: column;
            }
            .card-icons {
                position: static;
                display: flex;
                justify-content: flex-end;
                margin-top: 10px;
            }
        }
        
        .checkmark {
            color: #2e8b57;
            font-size: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- <header class="header">
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Our Story</a>
            <a href="#" class="active">Services</a>
            <a href="#">Merch</a>
            <a href="#">Contact Us</a>
        </nav>
        <img src="path_to_your_logo.png" alt="Logo" class="logo">
        <div class="auth-buttons">
            <button class="btn btn-outline">Sign In</button>
            <button class="btn btn-primary">Join Now</button>
        </div>
    </header> -->

    <div class="payment-container">
        <div id="payment-form">
            <h1>Payment</h1>
            <p class="info-text">All transactions are secure and encrypted.</p>

            <div class="payment-option active">
                <input type="radio" id="credit-card" name="payment-method" checked>
                <label for="credit-card">Credit Card</label>
                <span class="card-icons">
                    <img src="{% static 'images/tip/image9.png' %}" alt="Credit Card Icons">
                </span>
                <input type="text" placeholder="Card Number">
                <input type="text" placeholder="Name On Card">
                <div class="input-row">
                    <input type="text" placeholder="Expiration Date (MM/YY)">
                    <input type="text" placeholder="Security Code">
                </div>
            </div>

            <div class="payment-option">
                <input type="radio" id="paypal" name="payment-method">
                <label for="paypal">PayPal</label>
                <span class="card-icons">
                    <img src="{% static 'images/tip/image8.png' %}" alt="PayPal Logo">
                </span>
            </div>

            <div class="button-container">
                <a href="{% url 'tip' %}">
                    <button class="button button-secondary">Return To Cart</button>
                </a>
                <a href="{% url 'orderComplete' %}">
                    <button class="button button-primary">Continue</button>
                </a>
            </div>
        </div>

        <div id="order-complete" style="display: none; text-align: center;">
            <img src="{% static 'images/tip/caffinelogo.png' %}" alt="Caffeinehead Blockchain Logo" class="logo">
            <h1>CAFFEINEHEAD BLOCKCHAIN</h1>
            <p class="subtitle">COFFEE COMPANY</p>
            <div class="checkmark">✓</div>
            <h2>Order Complete!</h2>
            <p class="message">Your payment has been received.<br>Thank you for shopping with us.</p>
            <button class="btn" onclick="window.location.href='/'">Return Home</button>
        </div>
    </div>

    <script>
        function showOrderComplete() {
            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('order-complete').style.display = 'block';
        }
    </script>
</body>

</html>
