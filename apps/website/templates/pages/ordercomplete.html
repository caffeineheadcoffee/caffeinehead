{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Complete - Caffeinehead Blockchain</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #4a4a4a;
            margin-bottom: 30px;
        }
        
        .message {
            color: #666;
            margin-bottom: 20px;
        }
        
        .btn {
            background-color: #2e8b57;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn:hover {
            background-color: #3cb371;
        }
        
        .checkmark {
            color: #2e8b57;
            font-size: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="{% static 'images/tip/caffinelogo.png' %}" alt="Caffeinehead Blockchain Logo" class="logo">
        <h1>CAFFEINEHEAD BLOCKCHAIN</h1>
        <p class="subtitle">COFFEE COMPANY</p>
        <div class="checkmark">✓</div>
        <h2>Order Complete!</h2>
        <p class="message">Your payment has been received.<br>Thank you for shopping with us.</p>
        <a href="/">
            <button class="btn">Return Home</button>
        </a>
    </div>
</body>

</html>
