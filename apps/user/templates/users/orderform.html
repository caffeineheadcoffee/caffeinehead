{% block main_content %}
<div class="container p-50">

        </div>
        <span class="visited"></span>
        <div class="w-auto gap-2 flex-column justify-content-center align-items-center d-flex">

        <span></span>

            <p class="f-12 text-color">Shipping</p>
        </div>
        <span></span> 
        <div class="w-auto gap-2 flex-column justify-content-center align-items-center d-flex">
            <a href="" class="steps-btn">
                <i class="far fa-credit-card fa-2"></i>
            </a>

        </div>
        
    </div>
